version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    groups:
      go-tools:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tools/gopls
    schedule:
      interval: weekly
    groups:
      gopls:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    groups:
      devcontainers:
        patterns: ["*"]
